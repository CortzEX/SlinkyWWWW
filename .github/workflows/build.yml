name: Build OpenSlinkyPlus

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  native:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure (MSVC x64)
        run: cmake -S . -B build -A x64

      - name: Build Release
        run: cmake --build build --config Release --parallel

      - name: Collect dist
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/bin/Release/OpenSlinkyPlus.exe dist/ -ErrorAction SilentlyContinue
          Copy-Item build/bin/Release/SlinkyNative.dll dist/ -ErrorAction SilentlyContinue
          Get-ChildItem dist | ForEach-Object { $_.FullName }

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: OpenSlinkyPlus-bin
          path: dist/*
          if-no-files-found: error
